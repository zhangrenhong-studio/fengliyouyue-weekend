const routes=[{id:1,type:'outdoor solo half',tag:'🌿 晒晒太阳',v:'',title:'沿着亮马河，慢慢走到傍晚',desc:'不赶路、不设打卡点。找一段水边，把今天交给风和光。',facts:'⌖ 望京附近　◷ 2–3 小时　¥ 免费　适合独自去',stops:[['14:30','从亮马桥附近开始','慢慢走到水边，不需要明确目的地。'],['15:20','找一处可以坐下的地方','晒会儿太阳，或只是看水面和人群。'],['16:40','留一段自由时间','想吃点东西就去，想回家也完全可以。']]},{id:2,type:'culture friends half',tag:'🖼️ 看点东西',v:'orange',title:'午后看展，再找一家舒服的小店',desc:'一场展览，一段安静的街区，一杯不着急喝完的咖啡。',facts:'⌖ 地铁约 25 分钟　◷ 3–4 小时　¥ 80 起　适合两三人',stops:[['13:40','抵达展览空间','给自己两个小时，慢慢看完。'],['16:00','在附近找一间小店','不必讨论展览是否“值得”，先坐下来。'],['17:20','选一段街区走走','把下午自然延长到傍晚。']]},{id:3,type:'food friends 2h',tag:'🍜 吃点好的',v:'green',title:'别只吃饭，去逛一段有风的街',desc:'适合临时约朋友：先吃点喜欢的，再用散步把话聊完。',facts:'⌖ 望京附近　◷ 2 小时　¥ 100 左右　适合约人',stops:[['18:30','找一家想吃的店','不需要等所有人都决定。'],['19:45','饭后走一段街','没有任务，只把想说的话聊完。']]},{id:4,type:'fresh night market solo half',tag:'🎪 玩点不一样',v:'blue',title:'给周末留一次新鲜体验',desc:'手作、演出或一场特别活动，选一个让今天有一点不同。',facts:'⌖ 地铁约 35 分钟　◷ 半天　¥ 120 起　可一个人去',stops:[['15:00','去做一次新鲜体验','手作、演出或主题活动，选一个就够。'],['17:30','为今天留一段空白','可以一个人吃饭，也可以临时约个朋友。']]},{id:5,type:'move friends 2h',tag:'🏸 动一动',v:'',title:'约一场轻运动，把身体叫醒',desc:'不需要运动计划。选一项愿意尝试的体验，再一起吃点东西。',facts:'⌖ 4.1 km　◷ 2–3 小时　¥ 80 起　适合约人',stops:[['15:00','选一项轻运动','攀岩、羽毛球、骑行或游泳都可以。'],['17:00','用一顿轻食收尾','不把周末变成训练任务。']]},{id:6,type:'family outdoor half',tag:'🧸 带家人出门',v:'green',title:'慢一点的亲子半日，去公园找找季节',desc:'留出观察、玩耍和休息的空白，让一家人的周末不必赶行程。',facts:'⌖ 7.4 km　◷ 半天　¥ 免费起　适合家庭',stops:[['10:00','从公园入口慢慢开始','今天的重点是一起在外面待一会。'],['11:00','找一处可以停留的草地','观察、玩耍、吃点东西都好。'],['12:30','不赶着结束','想继续走就走，想回家也很好。']]}];
let state={tab:'home',filter:'all',routeId:null,plan:null,publishMode:'ai',joined:false};const $=s=>document.querySelector(s);const toast=t=>{const x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2100)};const route=id=>routes.find(x=>x.id===id);const topbar=()=>`<header class="top"><div class="brand"><img src="logo.svg" alt="风里有约"><div><b>风里有约</b><small>BEIJING · WEEKEND</small></div></div><button class="avatar">予</button></header>`;const head=(t,right='')=>`<header class="head"><h1>${t}</h1>${right?`<button class="right">${right}</button>`:''}</header>`;
function cards(list){return list.length?`<div class="cards">${list.map(r=>`<button class="route-card" data-open="${r.id}"><div class="visual ${r.v}"><span class="tag">${r.tag}</span></div><div class="card-body"><h3>${r.title}</h3><p>${r.desc}</p><div class="facts">${r.facts}</div></div></button>`).join('')}</div>`:`<div class="empty">这个条件下暂时没有合适的周末方案。<br>换个时间或方式看看吧。</div>`}
function home(){let show=state.filter==='all'?routes.slice(0,4):routes.filter(r=>r.type.includes(state.filter));return `${topbar()}<main class="view active"><section class="hero"><div class="eyebrow">北京 · 周六</div><h1>这个周末，<br>去做点什么？</h1><p>从你附近开始，也可以去北京更远一点的地方。</p></section><div class="row"><button class="loc" data-location>⌖ <b>望京</b> · 按所在区域推荐</button><div class="seg"><button class="on">离我最近</button><button data-city>整个北京</button></div></div><button class="prompt" data-ai><span>还没想好？告诉我一点点</span><b>我有半天，想出去透透气</b></button><section class="sec"><div class="sec-title"><h2>今天想怎么过？</h2><button class="text-btn" data-tabgo="routes">全部方式</button></div><div class="ways">${[['all','✨','随便逛逛'],['culture','🖼️','看点东西'],['outdoor','🌿','出去走走'],['food','🍜','吃点好的'],['move','🚲','动一动'],['solo','☕','一个人待会'],['friends','👫','和朋友见面'],['fresh','🎪','玩点不一样']].map(x=>`<button class="way ${state.filter===x[0]?'on':''}" data-filter="${x[0]}"><em>${x[1]}</em>${x[2]}</button>`).join('')}</div></section><section class="sec"><div class="sec-title"><h2>${state.filter==='all'?'离你不远，今天就能去':'为你挑出的周末方式'}</h2><button class="text-btn" data-tabgo="routes">看全部</button></div>${cards(show)}</section></main>`}
function routesView(){const f=[['all','全部'],['2h','2 小时'],['half','半天'],['solo','适合一个人'],['friends','适合约人'],['night','看演出'],['market','逛市集'],['family','带家人']];let list=state.filter==='all'?routes:routes.filter(r=>r.type.includes(state.filter));return `${topbar()}<main class="view active">${head('北京周末玩法库')}<p class="sub">从你附近开始，也保留那些值得专程去一次的地方。</p><div class="chips">${f.map(x=>`<button class="chip ${state.filter===x[0]?'on':''}" data-filter="${x[0]}">${x[1]}</button>`).join('')}</div>${cards(list)}</main>`}
function routeDetail(){let r=route(state.routeId);return `${topbar()}<main class="view active">${head('路线详情','分享')}<section class="detail-hero"><span class="tag">${r.tag}</span><h2>${r.title}</h2><p>${r.desc}</p><div class="facts" style="color:#e8fbf4;margin-top:15px">${r.facts}</div></section><section class="block"><h3>这次怎么走</h3><ol class="stops">${r.stops.map(s=>`<li><span class="time">${s[0]}</span><div><b>${s[1]}</b><p>${s[2]}</p></div></li>`).join('')}</ol></section><section class="block"><h3>出发前看一眼</h3><p class="sub">开放时间、预约要求和天气变化会在正式版本中实时核验；这份路线保留了足够的自由时间，不需要严格照着走。</p></section></main><div class="sticky"><button class="primary" data-adopt="${r.id}">${state.plan?.id===r.id?'已在我的计划里':'采用为我的计划'}</button></div>`}
function publish(){return `${topbar()}<main class="view active">${head('创建一条路线')}<p class="sub">先为自己生成，也可以整理成一条公开方案给别人采用。</p><section class="form-card"><h3>你想怎么创建？</h3><button class="option ${state.publishMode==='ai'?'selected':''}" data-mode="ai"><span><b>✦ AI 私人路线</b><small>输入一点想法，默认只对你自己可见</small></span><span>›</span></button><button class="option ${state.publishMode==='public'?'selected':''}" data-mode="public"><span><b>⌁ 公开路线方案</b><small>整理一条你愿意分享的北京周末方案</small></span><span>›</span></button></section><section class="form-card"><h3>${state.publishMode==='ai'?'今天想做点什么？':'把这条路线介绍给别人'}</h3><p>${state.publishMode==='ai'?'例如：周日下午从望京出发，一个人，想晒晒太阳，但不想太累。':'说明适合什么人、时长、预算与停留点。'}</p><textarea id="idea" placeholder="写下一点想法…" style="width:100%;height:88px;border:1px solid #dbe7e0;border-radius:13px;padding:11px;resize:none;color:var(--ink)"></textarea><button class="primary" style="margin-top:12px" data-create>${state.publishMode==='ai'?'生成一条我的周末路线':'继续编辑公开路线'}</button></section></main>`}
function invites(){return `${topbar()}<main class="view active">${head('同行邀约','我的邀约')}<p class="sub">同行只服务于一次具体出发。先看清时间、地点和节奏，再决定要不要加入。</p><div class="chips"><button class="chip on">正在邀约</button><button class="chip">我加入的</button></div><article class="invite"><div class="topline"><span class="status">还差 1 人</span><small>发起人：小北</small></div><h3>周日午后 · 看展后慢慢走走</h3><p>📍 三里屯附近集合　·　14:00 出发<br>◷ 3 小时　·　预算约 ¥100　·　节奏：慢逛、聊天</p><p>“不赶行程，看完展找地方喝杯东西。”</p><div class="actions"><button class="secondary" data-profile>看看发起人</button><button class="primary" data-join>${state.joined?'已加入':'加入这次同行'}</button></div></article><article class="invite"><div class="topline"><span class="status">还差 2 人</span><small>发起人：陈一</small></div><h3>周六傍晚 · 亮马河散步</h3><p>📍 亮马桥地铁站　·　17:30 出发<br>◷ 2 小时　·　预算免费　·　节奏：安静走走</p><p>“想出去透口气，有缘一起走一段。”</p><div class="actions"><button class="secondary" data-profile>看看发起人</button><button class="primary" data-join>加入这次同行</button></div></article><div class="empty">首版会把同行保持得很克制：<br>没有陌生人私信，加入后才可进入本次邀约私聊。</div></main>`}
function mine(){return `${topbar()}<main class="view active">${head('我的')}<section class="form-card"><div class="row"><div><h3 style="margin:0">予安</h3><p style="margin:4px 0 0">北京 · 慢走、看展、偶尔临时出发</p></div><button class="secondary" style="width:auto;padding:9px 12px" data-profile>编辑资料</button></div></section><section class="sec"><div class="sec-title"><h2>我的计划</h2><button class="text-btn" data-plans>全部计划</button></div>${state.plan?`<article class="plan"><span class="status">待决定</span><br><b>${state.plan.title}</b><p>还没有安排时间。想去的时候，给自己约一个下午。</p><button class="text-btn" data-start>安排时间 →</button></article>`:`<div class="empty">还没有计划。<br>从一条路线开始，给周末留一个小约定。</div>`}</section><section class="sec"><div class="sec-title"><h2>生活记录</h2><button class="text-btn" data-record>写一条</button></div><article class="record"><small>上个周末 · 亮马河</small><p>天快黑的时候，水面是很安静的蓝。<br>那天没有做什么，但回来时心情很好。</p></article></section></main>`}
function render(){let v=state.routeId?'detail':state.tab;$('#content').innerHTML=v==='home'?home():v==='routes'?routesView():v==='detail'?routeDetail():v==='publish'?publish():v==='invites'?invites():mine();document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.tab===state.tab));bind()}
function sheet(title,copy,body,action,fn){$('#sheet-title').textContent=title;$('#sheet-copy').textContent=copy;$('#sheet-body').innerHTML=body;$('#sheet-action').textContent=action;$('#sheet-action').onclick=()=>{fn();closeSheet()};$('#shade').classList.add('show');$('#sheet').classList.add('show')}function closeSheet(){$('#shade').classList.remove('show');$('#sheet').classList.remove('show')}function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.routeId=null;state.tab=b.dataset.tab;render()});document.querySelectorAll('[data-tabgo]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tabgo;state.routeId=null;render()});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;render()});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{state.routeId=+b.dataset.open;render()});document.querySelectorAll('[data-adopt]').forEach(b=>b.onclick=()=>{let r=route(+b.dataset.adopt);state.plan=r;toast('已采用为我的计划');render()});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.publishMode=b.dataset.mode;render()});let ai=$('[data-ai]');if(ai)ai.onclick=()=>sheet('给自己约一次出发','告诉我一点点空闲时间和想要的节奏，我会给你一份适合现在的北京周末计划。','<div class="option selected"><span><b>周六下午 · 望京附近</b><small>2–3 小时 · 想透透气 · 一个人也可以</small></span></div>','生成我的周末计划',()=>{state.plan=route(1);toast('已生成一条周末计划');render()});let loc=$('[data-location]');if(loc)loc.onclick=()=>sheet('从哪里出发？','位置仅用于为你排序附近的周末方案，不会公开给其他用户。','<div class="option selected"><span><b>⌖ 使用所在区域</b><small>当前：望京附近</small></span></div><div class="option"><span><b>⌂ 选择常用出发地</b><small>家、公司或任意地铁站</small></span></div>','按望京附近推荐',()=>toast('已按望京附近推荐'));let city=$('[data-city]');if(city)city.onclick=()=>toast('已切换为整个北京的周末推荐');let create=$('[data-create]');if(create)create.onclick=()=>sheet(state.publishMode==='ai'?'正在为你整理路线':'继续完善公开路线',state.publishMode==='ai'?'首版会先让每条 AI 路线只对自己可见。':'公开路线需要补齐地点、预算、时长与适用方式。','<div class="option selected"><span><b>路线草稿已准备好</b><small>创建后仍由你决定是否保存或公开</small></span></div>','好的',()=>toast('已保存为草稿'));document.querySelectorAll('[data-join]').forEach(b=>b.onclick=()=>{state.joined=true;b.textContent='已加入';toast('已加入，可进入本次邀约私聊')});document.querySelectorAll('[data-profile]').forEach(b=>b.onclick=()=>sheet('小北的公开主页','加入同行前，你可以只看与本次出发相关的公开资料。','<div class="form-card"><b>小北 · 北京</b><p>喜欢看展和慢走。周末多数时间可以出发。</p><div class="facts">出发节奏：不赶时间　·　常见时间：周末下午</div></div>','返回',()=>{}));let start=$('[data-start]');if(start)start.onclick=()=>sheet('什么时候出发？','安排一个大概时间就好，不需要把周末排得很满。','<div class="option selected"><span><b>这个周六下午</b><small>14:30 左右出发</small></span></div><div class="option"><span><b>下个周末再说</b><small>继续留在待决定</small></span></div>','安排这次出发',()=>toast('已安排：周六下午出发'));let rec=$('[data-record]');if(rec)rec.onclick=()=>sheet('留一句给今天','记录默认只有你自己能看见。','<textarea placeholder="今天的风怎么样？" style="width:100%;height:90px;border:1px solid #dbe7e0;border-radius:13px;padding:11px;resize:none"></textarea>','保存私密记录',()=>toast('已保存，只对你自己可见'))}$('#shade').onclick=closeSheet;render();
</script></body></html>
